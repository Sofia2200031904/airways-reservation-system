# Server
server.port=${SERVER_PORT:8080}
spring.application.name=airways-reservation-system

# Configure database credentials through the environment.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/airways_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Use a strong secret of your own in production.
jwt.secret=${JWT_SECRET:replace-this-with-a-long-random-secret-before-use}
jwt.expiration=${JWT_EXPIRATION:86400000}

logging.level.com.airways=INFO
logging.level.org.springframework.security=INFO
